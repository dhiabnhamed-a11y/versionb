name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:unit
      - run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskit
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/taskit
          AUTH_SECRET: ci-build-secret-min-32-chars-long
          NEXTAUTH_SECRET: ci-build-secret-min-32-chars-long
