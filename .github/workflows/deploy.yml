name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy-cloudflare:
    if: vars.DEPLOY_TARGET == 'cloudflare'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Seed demo data
        if: vars.DEMO_SEED_ENABLED == 'true' && secrets.DEMO_SEED_SECRET != ''
        run: |
          curl -f -X POST \
            "${{ vars.APP_URL }}/api/admin/seed-demo" \
            -H "Authorization: Bearer ${{ secrets.DEMO_SEED_SECRET }}" \
            --max-time 130 \
            --retry 2 \
            --retry-delay 5
        continue-on-error: true

  deploy-node:
    if: vars.DEPLOY_TARGET == 'node'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Seed demo data
        if: vars.DEMO_SEED_ENABLED == 'true' && secrets.DEMO_SEED_SECRET != ''
        run: |
          curl -f -X POST \
            "${{ vars.APP_URL }}/api/admin/seed-demo" \
            -H "Authorization: Bearer ${{ secrets.DEMO_SEED_SECRET }}" \
            --max-time 130 \
            --retry 2 \
            --retry-delay 5
        continue-on-error: true
