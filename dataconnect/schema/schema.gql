type User @table {
  displayName: String!
  email: String!
  role: String!
  createdAt: Timestamp!
  photoUrl: String
}

type Project @table {
  name: String!
  startDate: Date!
  dueDate: Date!
  createdAt: Timestamp!
  description: String
  status: String
  projectManager: User!
}

type Task @table {
  title: String!
  status: String!
  priority: String!
  dueDate: Date!
  createdAt: Timestamp!
  description: String
  project: Project!
  assignee: User
}

type Comment @table {
  content: String!
  createdAt: Timestamp!
  task: Task!
  author: User!
}